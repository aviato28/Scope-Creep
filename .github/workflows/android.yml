name: Android CI
on:
  push:
  pull_request:
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - uses: gradle/actions/setup-gradle@v4
      - name: Install SDK packages
        run: yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "platforms;android-35" "build-tools;35.0.0" >/dev/null
      - name: Test and build
        run: ./gradlew :sim-core:test :app:assembleDirectDebug :app:assembleDirectPreview
      # Screenshot tests (Roborazzi on Robolectric, no emulator). Baselines: app/src/test/screenshots/;
      # re-record locally with ./gradlew :app:recordRoborazziDirectDebug
      - name: Verify screenshots
        run: ./gradlew :app:verifyRoborazziDirectDebug :app:testDirectDebugUnitTest
      - name: Lint (non-blocking)
        continue-on-error: true
        run: ./gradlew :app:lintDirectDebug
      - uses: actions/upload-artifact@v4
        with:
          name: scope-creep-debug-apk
          path: app/build/outputs/apk/direct/debug/*.apk
      - uses: actions/upload-artifact@v4
        with:
          name: scope-creep-preview-apk
          path: app/build/outputs/apk/direct/preview/*.apk
      - name: Screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: screenshots
          path: app/src/test/screenshots/
          if-no-files-found: ignore
      - name: Screenshot diffs (on failure)
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: screenshot-diffs
          path: |
            app/build/outputs/roborazzi/
            app/build/reports/roborazzi/
          if-no-files-found: ignore
