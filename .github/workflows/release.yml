name: Release

on:
  push:
    # Release by changing VERSION on any branch, or by pushing a v* tag.
    branches: ['**']
    tags: ['v*']
    paths: ['VERSION']
  workflow_dispatch:
    inputs:
      version:
        description: 'Version without the v, e.g. 0.3.0 (append -beta.1 for a pre-release)'
        required: true

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    env:
      SIGNING_STORE_PASSWORD: ${{ secrets.SIGNING_STORE_PASSWORD }}
      SIGNING_KEY_ALIAS: ${{ secrets.SIGNING_KEY_ALIAS }}
      SIGNING_KEY_PASSWORD: ${{ secrets.SIGNING_KEY_PASSWORD }}
      KEYSTORE_B64: ${{ secrets.SIGNING_KEYSTORE_B64 }}
    steps:
      - uses: actions/checkout@v4
      - name: Resolve tag
        env:
          INPUT_VERSION: ${{ inputs.version }}
        run: |
          if [ "$GITHUB_EVENT_NAME" = "workflow_dispatch" ]; then TAG="v$INPUT_VERSION"
          elif [ "$GITHUB_REF_TYPE" = "tag" ]; then TAG="$GITHUB_REF_NAME"
          else TAG="v$(tr -d '[:space:]' < VERSION)"; fi
          case "$TAG" in *[!A-Za-z0-9.-]*) echo "::error::Bad version '$TAG'"; exit 1 ;; v[0-9]*.[0-9]*.[0-9]*) ;; *) echo "::error::Bad version '$TAG'"; exit 1 ;; esac
          echo "TAG=$TAG" >> "$GITHUB_ENV"
      - name: Skip if already released
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          if gh release view "$TAG" -R "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            echo "::error::Release $TAG already exists; bump VERSION."; exit 1
          fi
      - name: Check signing secrets
        run: |
          missing=""
          for v in KEYSTORE_B64 SIGNING_STORE_PASSWORD SIGNING_KEY_ALIAS SIGNING_KEY_PASSWORD; do
            [ -n "${!v}" ] || missing="$missing $v"
          done
          if [ -n "$missing" ]; then
            echo "::error::Missing repository secrets (SIGNING_KEYSTORE_B64 is the base64 keystore):$missing. See docs/releasing.md."
            exit 1
          fi
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: 17 }
      - uses: gradle/actions/setup-gradle@v4
      - name: Decode keystore
        run: |
          echo "$KEYSTORE_B64" | base64 -d > "$RUNNER_TEMP/release.jks"
          echo "SIGNING_KEYSTORE_PATH=$RUNNER_TEMP/release.jks" >> "$GITHUB_ENV"
      - name: Build
        run: |
          VERSION="${TAG#v}"
          echo "VERSION=$VERSION" >> "$GITHUB_ENV"
          ./gradlew :sim-core:test :app:assembleDirectRelease \
            -PversionName="$VERSION" -PversionCode=$((GITHUB_RUN_NUMBER + 100))
      - name: Package
        run: |
          mkdir out
          cp app/build/outputs/apk/direct/release/*.apk "out/scope-creep-$VERSION.apk"
          (cd out && sha256sum "scope-creep-$VERSION.apk" > checksums.txt && cat checksums.txt)
      - name: Create release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          flags=""
          case "$TAG" in *-beta*) flags="--prerelease" ;; esac
          gh release create "$TAG" --target "$GITHUB_SHA" $flags --title "Scope Creep $VERSION" --generate-notes \
            "out/scope-creep-$VERSION.apk" out/checksums.txt
      - name: Remove keystore
        if: always()
        run: rm -f "$RUNNER_TEMP/release.jks"
