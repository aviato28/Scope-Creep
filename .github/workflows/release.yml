name: Release

on:
  push:
    tags: ['v*']

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    env:
      SIGNING_STORE_PASSWORD: ${{ secrets.SIGNING_STORE_PASSWORD }}
      SIGNING_KEY_ALIAS: ${{ secrets.SIGNING_KEY_ALIAS }}
      SIGNING_KEY_PASSWORD: ${{ secrets.SIGNING_KEY_PASSWORD }}
      KEYSTORE_B64: ${{ secrets.SIGNING_KEYSTORE_B64 }}
    steps:
      - uses: actions/checkout@v4
      - name: Check signing secrets
        run: |
          missing=""
          for v in KEYSTORE_B64 SIGNING_STORE_PASSWORD SIGNING_KEY_ALIAS SIGNING_KEY_PASSWORD; do
            [ -n "${!v}" ] || missing="$missing $v"
          done
          if [ -n "$missing" ]; then
            echo "::error::Missing repository secrets (SIGNING_KEYSTORE_B64 is the base64 keystore):$missing. See docs/releasing.md."
            exit 1
          fi
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: 17 }
      - uses: gradle/actions/setup-gradle@v4
      - name: Decode keystore
        run: |
          echo "$KEYSTORE_B64" | base64 -d > "$RUNNER_TEMP/release.jks"
          echo "SIGNING_KEYSTORE_PATH=$RUNNER_TEMP/release.jks" >> "$GITHUB_ENV"
      - name: Build
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          echo "VERSION=$VERSION" >> "$GITHUB_ENV"
          ./gradlew :sim-core:test :app:assembleDirectRelease \
            -PversionName="$VERSION" -PversionCode=$((GITHUB_RUN_NUMBER + 100))
      - name: Package
        run: |
          mkdir out
          cp app/build/outputs/apk/direct/release/*.apk "out/scope-creep-$VERSION.apk"
          (cd out && sha256sum "scope-creep-$VERSION.apk" > checksums.txt && cat checksums.txt)
      - name: Create release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          flags=""
          case "$GITHUB_REF_NAME" in *-beta*) flags="--prerelease" ;; esac
          gh release create "$GITHUB_REF_NAME" $flags --title "Scope Creep $VERSION" --generate-notes \
            "out/scope-creep-$VERSION.apk" out/checksums.txt
      - name: Remove keystore
        if: always()
        run: rm -f "$RUNNER_TEMP/release.jks"
